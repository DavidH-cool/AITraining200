name: Work-to-Blog Agent CI & Golden Dataset Evaluation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  unit-and-eval-suite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Unit & Rubric Verification Tests
        run: |
          pytest -v

      - name: Run Golden Dataset Regression Evaluation Harness
        run: |
          python -m evals.run_evals
